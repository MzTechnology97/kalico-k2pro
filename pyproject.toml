[project]
name = "Kalico"
version = "0.12.1"
requires-python = ">=3.9"
dependencies = [
  "cffi==1.17.1 ; python_version >= '3.13'",
  "cffi==1.15.1 ; python_version < '3.13'",
  "greenlet==3.3 ; python_version >= '3.14'",
  "greenlet==3.1 ; python_version == '3.13'",
  "greenlet==3.0.3 ; python_version == '3.12'",
  "greenlet==2.0.2 ; python_version < '3.12'",
  "Jinja2>=3.1.6",
  "markupsafe==2.1.5",
  "numpy~=2.0 ; python_version=='3.9'",
  "numpy~=2.2 ; python_version>='3.10' and python_version<'3.14'",
  "numpy~=2.3.0 ; python_version>='3.14'",
  "pyserial==3.4",
  "python-can~=4.6",
]

[dependency-groups]
dev = [
  "ruff==0.15.22",
  "pre-commit>=4.0.1",
  "pytest-xdist>=3.6.1",
  "pytest>=8.3.4",
]

[project.urls]
homepage = "https://kalico.gg/"
source = "https://github.com/KalicoCrew/kalico"
documentation = "https://docs.kalico.gg/"
issues = "https://github.com/KalicoCrew/kalico/issues"
funding = "https://docs.kalico.gg/Sponsors.html"

[tool.ruff]
line-length = 80
indent-width = 4
exclude = ["./.github", "./.history", "./config", "./docs", "./lib", "./src"]
# K2 / K2-OpenHost modules keep the style of the Jacob10383 K2 firmware they
# are synced from (k2-pro-custom-firmware), so upstream syncs merge cleanly.
extend-exclude = [
  "klippy/extras/box.py",
  "klippy/extras/box_*.py",
  "klippy/extras/chamber_heater_circulation_fan.py",
  "klippy/extras/extended_zone_transform.py",
  "klippy/extras/external_rfid_reader.py",
  "klippy/extras/fan_feedback.py",
  "klippy/extras/force_stop_homing.py",
  "klippy/extras/homing.py",
  "klippy/extras/led_idle_manager.py",
  "klippy/extras/motion_limits.py",
  "klippy/extras/motor_control.py",
  "klippy/extras/power_loss_recovery.py",
  "klippy/extras/prtouch.py",
  "klippy/extras/ptc_power_limiter.py",
  "klippy/extras/serial_485.py",
  "klippy/extras/temperature_fan_manual_floor.py",
  "klippy/extras/z_align.py",
  "scripts/generate_cfs_system_filaments.py",
  "test/test_box_*.py",
]
force-exclude = true

[tool.ruff.lint]
extend-select = [
  "B006",  # Checks for uses of mutable objects as function argument defaults
  "FA100", # Detect when type annotations could be made better with PEP563
  "FA102", # Detect type annotations that would require `from __future__ import annotations`
  "I001",  # unsorted-imports: Import block is un-sorted or un-formatted
  "I002",  # missing-required-import: Missing required import: {name}"
]
ignore = [
  "C901", # Function is too complex
  "E501", # Line too long (82 > 79 characters)
  "E302", # Expected 2 blank lines, found 0
  "E722", # Do not use bare except, specify exception instead
  "E741", # Do not use variables named 'I', 'O', or 'l'
  "F841", # Local variable name is assigned to but never used
  "E721", # Do not compare types, use 'isinstance()'
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
