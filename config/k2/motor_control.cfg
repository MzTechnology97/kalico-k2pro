# K2 Pro OpenHost motor-control profile
# Based on the user-validated F012 profile.
# Original profile metadata:
# Version: v1.0.0
# CreateDate: 2025/08/26
# FW: mot2_023_C30-mot2_002_071.bin
#
# K2 Pro topology:
# - X / Y: closed-loop MOT2 controllers on the main RS485 bus
# - E: closed-loop controller through the nozzle-MCU transparent transport
# - Z: conventional TMC2208; intentionally NOT managed by motor_control

[motor_control]
overcurrent_switch: 0 # accepted for Creality compatibility; not applied by K2-OpenHost
switch: 1 # accepted for Creality compatibility; not applied by K2-OpenHost
retries: 8
startup_delay: 5.0  # grace period after RS485 becomes ready
retry_delay: 3.0    # delay between automatic startup retries
cut_pos_offset: 0.4
motor_closed_loop: x,y,e
# warn: a critical override that does not read back right is a warning and
# the axis runs degraded (motor_control.readiness). block: startup fails and
# retries instead. Tuning these values works the same with both.
override_policy: warn

# K2 Pro closed-loop pin mapping
motor_x_dir: PB9,0
motor_x_step: PB10,0
motor_x_stall: PB11
motor_y_dir: !PB7,0
motor_y_step: PB8,0
motor_y_stall: PB12
motor_e_stall: nozzle_mcu:PB12

# Z/Z1 are intentionally absent on K2 Pro motor_control.
# Z is configured separately through [stepper_z] + [tmc2208 stepper_z].

# -------------------------------------------------------------------------
# X - validated Balanced / Performance profile
# -------------------------------------------------------------------------

# position loop PID
x_controller_pos_loop_pid_param_kp: 300

# speed loop PID
x_controller_spd_loop_pid_param_kp: 0.032
x_controller_spd_loop_pid_param_ki: 5.5

# current loop PID
x_controller_cur_loop_pid_param_kp: 2.5
x_controller_cur_loop_pid_param_ki: 200.0

# LESO
x_controller_leso_param_b0k: 1.0
x_controller_leso_param_z3k: 0
x_controller_leso_param_wp: 4000
x_controller_leso_param_ws: 4000
x_controller_leso_param_wd: 400

# current filter
x_controller_cur_filter_param_en: 1
x_controller_cur_filter_param_fc: 8000

# protection
x_protection_param_prt_track_max_err: 0.3
x_protection_param_prt_track_err_time: 0.1

# step controller
x_step_controller_param_subdivision: 32

