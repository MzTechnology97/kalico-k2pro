[box]
observation_mode: false                  # K2-OpenHost operational CFS mode. Commands, tool changes and writes are enabled.
box_count: 1                           # K2 Pro ships with one CFS. Increase only when additional CFS units are actually connected.
state_path: ~/printer_data/filament_box.json # Runtime state: manual/RFID slot assignments, spool remaining estimates, settings and box identities. Startup restores cached occupied slots without rescanning every tag.
library_path: ~/printer_data/config/cfs_filaments.json # Custom filament profiles (user, imported, RFID-registered) in their own JSON file, visible in the Mainsail file manager and Moonraker backups. Replaced files are reloaded automatically or with _BOX_FILAMENT_RELOAD. Profiles found in an older state file move here once (backup: <state_path>.pre-library).
system_material_database_path: ~/klipper/config/k2/cfs_system_filaments.json # Shipped Creality + Generic K2-RFID system catalog, read only and kept in memory so catalog updates apply at the next start.
material_database_path: ~/printer_data/config/k2_rfid_custom_materials.json # Optional K2-RFID database to import (compact or Creality material_database.json format); colors stay spool metadata, not profile identity.
auto_register_rfid_filaments: true       # Create/reuse library profiles automatically when a known RFID material is seen.
auto_bambu_rfid_fallback: true             # API7 only: after a stock Creality RFID result is unknown, try Bambu stock-task capture.
rfid_fallback_budget: 1                  # Third-party RFID: stock CFS rereads (~45 s each) per spool insertion; known UIDs come from a cache.
rfid_fallback_manual_budget: 3           # Rereads per slot on a manual _BOX_RFID_READ_SLOT.
auto_seed_material_database: true        # Import material_database_path into the library at startup when its content changed, deduplicated by brand/name/material. Profiles deleted from the library stay deleted until the import changes.
publish_lane_data: true                  # Publish occupied CFS slots to Moonraker's lane_data namespace, read by official OrcaSlicer "Sync" (filament list from the printer).
purge_speed: 20                        # Volumetric flow rate (mm^3/s) for purges.
hotend_feed_speed: 20                  # Volumetric flow rate (mm^3/s) from gears to hotend.
hotend_feed_length: 63                 # Distance (mm) advanced to hotend after CFS load.
print_prime_speed: 10                  # Volumetric flow rate (mm^3/s) for prime moves.
print_prime_length: 20                 # Distance (mm) primed when no purge runs.
fallback_purge_length: 100             # Distance (mm) purged without slicer matrix or on same-slot change.
default_temp: 220                      # Fallback nozzle temp (°C) when unspecified.
retract_length: 30                     # Distance (mm) retracted before cutting during unloads.
retract_velocity: 3000.0               # Extruder retract/snap/cut-assist feedrate (mm/min).
external_feed_velocity: 600.0          # Slow extruder feedrate (mm/min) for external insert and runout tail.
toolchange_z_hop: 2.0                  # Relative Z clearance (mm) for toolchange travel moves.

clean_pad_left_x: 155                  # Silicone pad left X edge.
clean_pad_right_x: 165                 # Silicone pad right X edge.
clean_pad_front_y: 324                 # Silicone pad front Y edge.
clean_pad_back_y: 332                  # Silicone pad back Y edge.
clean_pad_passes: 1                    # Complete silicone scrub passes.
wastebin_pos_x: 124.0                  # Wastebin X coordinate.
wastebin_pos_y: 329.0                  # Wastebin Y coordinate.
filament_retry_moves: Y300, X300, Y50, X50 # Wastebin-to-wastebin moves before retrying a stalled load or blocked unload. K2 Pro: Y max 332, X max 302 (the K2 Plus default Y350 is out of range).
travel_velocity: 18000.0               # XY travel feedrate (mm/min) for wastebin, cut approach/return, and service moves.
z_velocity: 600.0                      # Z lift/lower feedrate (mm/min) for cut clearance and toolchange hops.
clean_velocity: 9000.0                 # Cleaning move feedrate (mm/min).
snap_fan_speed: 1.0                    # Part-fan speed during flush-clean-snap, 0-1.
snap_fan_dwell_ms: 3000                # Part-fan dwell before snap retract, ms.
clog_detection: True                   # Default of the Clog Detection switch: pause when the extruder feeds but the CFS stops refilling. _BOX_SET_CLOG_DETECTION ENABLE=0|1 saves a runtime value.
clog_extruder_length: 80               # Extruder feed (mm) with no CFS refill before pausing; 30 minimum (one CFS refill chunk is ~25-30 mm).
notify_macro: _BOX_NOTIFY                # CFS events (runout swap, runout pause, clog, CFS error, unknown tag, low filament, humidity) go to this macro; empty = off.
humidity_warnings: True                  # Warn at print start when a mapped spool sits in a CFS more humid than its material tolerates (PLA 55 %, PETG 50 %, TPU 40 %, PC 35 %, PA 25 %, PVA 20 %...).
#humidity_limits: PA:15, PLA:45          # Override the humidity limit (%) of single materials.

pre_cut_pos_x: 10.0                    # X approach/return position for cutter strokes.
# cut_pos_x: written by CALIBRATE_CUT_POS; full actuation X position.
cut_pos_y: 200.0                       # Y coordinate held during cutter strokes.
cut_velocity: 30000.0                  # Cutter actuation move feedrate (mm/min).
pre_cut_cal_pos_x: -5.0                # Initial X probe position for CALIBRATE_CUT_POS.
check_cut_pos_x_max: -6.5              # Upper X bound for cutter calibration motor hits.
check_cut_pos_x_min: -10               # Lower X bound for cutter calibration search range.

# CFS event notifications, called by Box with EVENT, TITLE and MESSAGE.
# Events: runout_swap, runout, clog, cfs_error, rfid_unknown, low_filament,
# humidity.
# Keep in `events` the ones you want; turn off what you do not use.
[gcode_macro _BOX_NOTIFY]
description: Forward a CFS event to Mobileraker and the Telegram bot
variable_events: "runout_swap,runout,clog,cfs_error,rfid_unknown,low_filament,humidity"
variable_mobileraker: True   # mobileraker_companion: MR_NOTIFY:title|message
variable_telegram: True      # moonraker-telegram-bot: RESPOND PREFIX=tgnotify
gcode:
    {% set event = params.EVENT|default("")|lower %}
    {% set title = params.TITLE|default("CFS") %}
    {% set message = params.MESSAGE|default("") %}
    {% if event in events.split(",") %}
        {% if mobileraker %}
            {action_respond_info("MR_NOTIFY:%s|%s" % (title, message))}
        {% endif %}
        {% if telegram %}
            RESPOND PREFIX=tgnotify MSG="{title}: {message}"
        {% endif %}
    {% endif %}

# K2 Pro CFS 1.1.3 returns a four-byte BOX_STATE frame. The adapter decodes
# temperature/humidity/state and supplements the omitted loaded-path mask with
# the read-only hub-mask query without changing Jacob's generic protocol module.
[box_k2pro]

# Read-only protocol diagnostics: CFS firmware identity plus raw 0x15 hardware
# status. Temperature/humidity come from the K2 Pro BOX_STATE adapter above.
[box_environment]
poll_interval: 5.0

# Jacob-compatible print-start mapping API used by mainsail-k2openhost.
# Adds BOX_PRINT_INFO / BOX_PRINT_START and exposes print_info / print_mapping
# through the existing Moonraker "box" object.
[box_print_mapping]
auto_map_prints: true                  # Safe backend auto-map for ordinary Moonraker/Orca starts. Enable after slot inventory is populated.
auto_map_block_unresolved: true         # Reject a direct start when one or more slicer tools cannot be matched safely.

[external_rfid_reader]
beep_enabled: true                     # Sound buzzer on successful RFID scan.
beep_backend: t113                     # K2-OpenHost: the buzzer is on the T113 ([k2_t113]); stock K2: local.

[extended_zone_transform] #LT: Estimated for now.
standard_y_max: 301.0                  # Print-bed Y max; beyond this is the rear service zone.
extended_y_max: 332.0                  # Absolute Y max including brush/wastebin.
safe_x_min: 122.0                      # Min X allowed while Y is past standard_y_max.
safe_x_max: 230.0                      # Max X allowed while Y is past standard_y_max.

[motion_limits]
# Loads save/restore helpers for temporary toolchange motion limits.
