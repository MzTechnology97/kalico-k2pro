# CPU fan of the host, driven by Klipper (host_fan).
# Reference host: Raspberry Pi CM5 on a Waveshare CM5-IO-BASE-A; the 4-pin
# fan header is the CM5's FAN_PWM/FAN_TACH (RP1 PWM, kernel pwm-fan driver).
# Needs write access to the kernel fan and a fallback when Klipper stops:
# installer helper './helper.sh install host-fan'. Without it, Klipper only
# monitors the fan and the kernel keeps driving it.
#
# Shown in Mainsail as the temperature fan "cm5_fan" (temperature, target,
# speed, rpm); its target can be set there. G-code:
#   SET_HOST_FAN TARGET=55      fan follows the CPU temperature
#   SET_HOST_FAN SPEED=0.6      fixed speed (0..1)
#   SET_HOST_FAN MODE=kernel    back to the kernel's automatic control
#   HOST_FAN_STATUS
[host_fan cm5_fan]
control: target         # target | manual | kernel
target_temp: 55         # min_speed up to this CPU temperature...
ramp_delta: 15          # ...rising to max_speed 15 C above it
min_speed: 0.3
max_speed: 1.0
full_speed_temp: 75     # max_speed above this, in every mode
#shutdown_speed: 1.0    # speed on a Klipper shutdown (default: back to the kernel)
