# Fans: the part, side, chamber and electronics fans with their
# tachometer feedback, then M106/M107 (toolhead part fan P0, side part
# fan P2, chamber exhaust P3) and M141/M191 for the chamber.

# === Fans and tachometers ===

[fan_feedback]
# Tachometer policy (native tachometer_pin on each fan); K2 Plus and K2 Pro share the pins.
fan_objects: heater_fan chamber_heater_fan, heater_fan heatbreak_fan, fan
shutdown_fans: heater_fan chamber_heater_fan
pause_fans: heater_fan heatbreak_fan, fan
fan_names: chamber heater fan, heatbreak fan, part cooling fan

[fan]
pin: !nozzle_mcu:PB15
tachometer_pin: nozzle_mcu:PC13
tachometer_ppr: 2
tachometer_poll_interval: 0.0005
enable_pin: nozzle_mcu:PB6
cycle_time: 0.010
hardware_pwm: false
min_power: 0.10
shutdown_speed: 0

[multi_pin chamber_exhaust_fan_pins]
pins: PB1,PB3

[temperature_fan chamber_exhaust_fans]
pin: multi_pin:chamber_exhaust_fan_pins
cycle_time: 0.0100
hardware_pwm: false
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC5
control: watermark
target_temp: 0
max_delta: 0.5
min_temp: -30
max_temp: 80
max_speed: 1.0
min_speed: 0.0
shutdown_speed: 0

[temperature_fan_manual_floor chamber_exhaust_fans]
generic_fan: True   # Chamber Exhaust Fans slider in Mainsail: sets the manual speed floor

[multi_pin aux_fan_pins]
pins: PB4

[fan_generic aux_fans]
pin: multi_pin:aux_fan_pins
cycle_time: 0.0100
hardware_pwm: false
min_power: 0.35
kick_start_time: 1.0
shutdown_speed: 0

[controller_fan extruder_motor_fan]
pin: nozzle_mcu:PB1
stepper: 
heater: extruder
fan_speed: 1.0
idle_timeout: 30
shutdown_speed: 0

[heater_fan heatbreak_fan]
pin: nozzle_mcu:PB7
tachometer_pin: nozzle_mcu:PA12
tachometer_ppr: 2
tachometer_poll_interval: 0.0005
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
shutdown_speed: 1.0

[controller_fan ssr_board_fan]
pin: PA0
heater: heater_bed,chamber_heater
stepper:
fan_speed: 1.0
idle_speed: 0.5
idle_timeout: 30
shutdown_speed: 0.0

[chamber_heater_circulation_fan chamber_heater_fan]
pin: !PB14
tachometer_pin: PC6
tachometer_ppr: 2
tachometer_poll_interval: 0.0005
enable_pin: PB2
heater: chamber_heater
# Fan speed while chamber heater PWM is active before print starts
preheat_speed: 1.0
# Fan speed while chamber heater PWM is during print(Creality always ran it at 30%)
printing_speed: 0.30

# ----------------------------------------------------------------------
# M-code fan and chamber macros
# ----------------------------------------------------------------------
[gcode_macro M106]
rename_existing: M106.1
gcode:
  {% set fan = params.P|default(0)|int %}
  {% set speed = params.S|default(255)|float %}
  {% set normalized_speed = [0.0, [speed / 255.0, 1.0]|min]|max %}
  {% if fan == 0 %}
    M106.1 S{speed}
  {% elif fan == 2 %}
    SET_FAN_SPEED FAN=aux_fans SPEED={normalized_speed}
  {% elif fan == 3 %}
    SET_TEMPERATURE_FAN_MANUAL_SPEED TEMPERATURE_FAN=chamber_exhaust_fans SPEED={normalized_speed}
  {% else %}
    RESPOND TYPE=error MSG="Unsupported M106 P{fan}. Use P0 for part cooling, P2 for aux_fans, or P3 for chamber exhaust filtration."
  {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
  {% set fan = params.P|default(-1)|int %}
  {% if fan == -1 %}
    M107.1
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% elif fan == 0 %}
    M107.1
  {% elif fan == 2 %}
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% elif fan == 3 %}
    SET_TEMPERATURE_FAN_MANUAL_SPEED TEMPERATURE_FAN=chamber_exhaust_fans SPEED=0
  {% else %}
    RESPOND TYPE=error MSG="Unsupported M107 P{fan}. Use P0 for part cooling, P2 for aux_fans, or P3 for chamber exhaust filtration."
  {% endif %}

[gcode_macro M141]
gcode:
  {% if 'S' in params %}
    {% set chamber_temp = params.S|float %}
    {% if chamber_temp > 40 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=0
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={chamber_temp}
    {% elif chamber_temp > 0 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET={chamber_temp}
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% else %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_exhaust_fans TARGET=0
      SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}
  {% endif %}

[gcode_macro M191]
gcode:
  {% if 'S' in params %}
    {% set chamber_temp = params.S|float %}
    {% if chamber_temp > 40 and printer.print_stats.state == "printing" %}
      RESPOND TYPE=echo MSG="M191 is waiting for chamber heat during an active print. It appears \"Activate temperature control\" is enabled in Orca Slicer. Disable it before slicing to get rid of this warning."
    {% endif %}
    M141 S{chamber_temp}
    {% if chamber_temp > 40 %}
      {% set max_delta = printer["configfile"]["config"]["heater_generic chamber_heater"].max_delta|float %}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={chamber_temp - max_delta}
    {% elif chamber_temp > 0 %}
      TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MAXIMUM={chamber_temp}
    {% endif %}
  {% endif %}
