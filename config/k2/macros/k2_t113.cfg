# K2-OpenHost: the printer's T113 board, seen from the external host.
#
# Needs the K2-OpenHost T113 bootstrap (slot B), which runs k2oh-ctl on the
# printer. The K2-OpenHost Installer Helper fills in host and copies the
# shared token to token_file. With host empty the section does nothing.
#
# G-code: BOARD_STATUS, BUZZER [MS] [COUNT], M300 [P] (if no M300 macro),
#         USB_BRIDGES_RESTART CONFIRM=1, SCREEN_RESTART,
#         MCU_POWER_CYCLE CONFIRM=1 (also works while Klipper is shut
#         down; it restarts the firmware afterwards).
# The MCU power rail is also a Moonraker power device (see the installer
# helper's moonraker_k2_t113.conf).

[k2_t113]
host:                     # T113 address, e.g. 192.168.1.60 (empty = disabled)
port: 7130
token_file: ~/printer_data/config/k2oh_t113.token
poll_interval: 10         # telemetry period in seconds; 0 = off
# Emergency stop on the MCU power rail. m112: an emergency stop (M112, the
# UI's stop button) also acts on the rail, so every heater and motor loses
# power even if an MCU stopped answering. any: every Klipper shutdown does.
# off: nothing.
estop_on_shutdown: m112
# cycle: cut the rail and restore it after 2 s, so the MCUs restart from reset
# with all outputs off (then FIRMWARE_RESTART). off: keep it cut until the
# power device or MCU_POWER_CYCLE CONFIRM=1 turns it back on.
estop_power: cycle
# Lost the link to an MCU while no print was running? Power-cycle the MCUs and
# restart the firmware automatically, at most once every 10 minutes.
auto_power_cycle: False

# Buzzer sounds, as in the stock firmware. Each is on,off,on,... in
# milliseconds (beep, pause, beep, ...): at most 16 steps and 10 s. Empty =
# silent. Try one with BUZZER SOUND=print_complete, or any pattern with
# BUZZER PATTERN=200,100,200.
sound_print_complete: 150,100,150,100,150,100,600   # print finished
sound_pause: 500,250,500                            # print paused (also filament runout)
sound_error: 1000,300,1000,300,1000                 # print stopped by an error
sound_cancel: 400                                   # print cancelled
sound_shutdown: 2000,400,2000                       # Klipper shutdown / emergency stop
sound_rfid: 200                                     # external spool RFID read
