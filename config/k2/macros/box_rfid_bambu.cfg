# Bambu Lab RFID interoperability layer.
#
# With CFS RFID v3.3/API7 automatic fallback uses Creality's stock RFID task,
# captures only Bambu block 4 material detail + block 5 RGBA, and never writes
# the tag. The CFS remains authoritative for remaining-filament percentage.
[box_rfid_bambu]
serial: serial485
address: 1
