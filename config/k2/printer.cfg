# === Host and MCUs ===

[danger_options]
log_statistics: True
log_config_file_at_startup: True
log_bed_mesh_at_startup: False
log_velocity_limit_changes: False
log_pressure_advance_changes: False
log_shutdown_info: True
log_serial_reader_warnings: True
log_startup_info: True
log_webhook_method_register_messages: False
multi_mcu_trsync_timeout: .1

[serial_485 serial485]
# Stable name of the T113 gadget interface (if00 Main, if01 Nozzle, if02
# RS-485). /dev/ttyUSBn changes when the gadget reconnects while Klipper
# still holds the old ports, and FIRMWARE_RESTART then cannot reconnect.
serial: /dev/serial/by-id/usb-Allwinner_Technology_Inc._Gadget_Serial-if02-port0 # T113 ttyGS2 -> ttyS5 (RS-485 / CFS / closed-loop)
baud: 230400
# No device answering for this long (and 3 timeouts in a row) means the RS-485
# link is lost; Klipper alone would not notice behind the T113 bridge.
link_lost_timeout: 10
# During a print: pause (default, resume once the link is back), warn (keep
# printing; CFS runout/feed and motor diagnostics stay blind), cancel
# (CANCEL_PRINT: heaters off, toolhead parked) or shutdown (stops Klipper).
# When idle: a warning only.
link_lost_action: pause

[mcu]
serial: /dev/serial/by-id/usb-Allwinner_Technology_Inc._Gadget_Serial-if00-port0 # T113 ttyGS0 -> ttyS2 (Main MCU)
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/serial/by-id/usb-Allwinner_Technology_Inc._Gadget_Serial-if01-port0 # T113 ttyGS1 -> ttyS3 (Nozzle MCU)
baud: 230400
restart_method: command

[mcu rpi]
serial: /tmp/klipper_host_mcu

[duplicate_pin_override]
pins: PC5,PC7,PB7,PB8,PB9,PB10,PB5,PB6,PA1,PB15,PB11,PB12,PB13,PA10,PA9,PB2,PB14,PB3,PB1

# Optional serial link monitor for long prints: round trip times of every MCU
# (from the clock answers Klipper already receives), serialqueue counters
# (retransmits, invalid bytes, srtt/rttvar, mcu_awake, task times) and RS-485
# request round trips, one CSV row per channel every interval.
# LINK_MONITOR_REPORT prints the percentiles. probe_hz adds get_uptime round
# trips for benchmarks only (0 = no extra traffic).
#[link_monitor]
#interval: 60
#log_path: ~/printer_data/logs/link_monitor.csv
#probe_hz: 0

# === Motion ===

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 10
square_corner_velocity: 10
max_z_accel: 300

[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA9
microsteps: 32
rotation_distance: 40
endstop_pin: PB11
position_endstop: 302
position_min: -13
position_max: 302
homing_speed: 150
second_homing_speed: 50
homing_retract_dist: 5
homing_accel: 1000

[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA8
microsteps: 32
rotation_distance: 40
endstop_pin: PB12
position_endstop: -6.5
position_min: -6.5
position_max: 332
homing_speed: 150
second_homing_speed: 50
homing_retract_dist: 5
homing_accel: 1000

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PA10
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 303
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 5

[tmc2208 stepper_z]
uart_pin: PC1
run_current: 0.84
stealthchop_threshold: 0.2
sense_resistor: 0.100

#[z_tilt]
#z_positions:
#    -15,175
#    375,175
#points:
#    5,175
#    345,175
#speed: 400
#horizontal_move_z: 5
#retries: 10
#retry_tolerance: 0.1

# K2 Pro bottom photoelectric switch (Creality F012 stock: endstop_pin_z PA15).
# Used by integrated G28 when Z is unknown and by power-loss recovery to
# re-reference Z by dropping the bed away from the nozzle.
[z_align]
endstop_pin_z: PA15
zd_up: 1
zes_untrig: 1
# quick/slow speed and distances use Creality's MCU step units (gear ratio
# 64:20 ignored, like the stock firmware): the bed moves at ~0.31 x the value,
# so quick_speed 30 is ~9.4 mm/s (under max_z_velocity 10) and slow_speed 10
# ~3.1 mm/s; rising_dist 10 is ~3.1 mm. Keep stepper_z at the stock 16
# microsteps: the MCU-driven routine lost steps (noise, photoelectric errors)
# at 64.
quick_speed: 30 # fast drop to the bottom switch: a full ~300 mm drop in ~32 s (validated)
slow_speed: 10 # slow settle pass that sets the reference
rising_dist: 10
safe_dist: 40
filter_cnt: 10
timeout: 80 # seconds per attempt; a full drop now takes ~32 s
retries: 5
retry_tolerance: 10
zmax: 301 # stepper_z position_max 303 - Creality zmax_safe_pox_diff 2
rise_distance: 255 # ~0.85 x zmax (Creality distance_ratio), then PRTouch homes
rise_speed: 10 # K2 Pro max_z_velocity

[axis_twist_compensation]
calibrate_start_x: 10
calibrate_end_x: 290
calibrate_y: 150

[screws_tilt_adjust]
screw1: 45, 28
screw1_name: Front Left
screw2: 255, 28
screw2_name: Front Right
screw3: 255, 272
screw3_name: Rear Right
screw4: 45, 272
screw4_name: Rear Left
speed: 150
horizontal_move_z: 10
screw_thread: CW-M4

# === Heaters ===

[thermistor my_thermistor]
temperature1: 25
resistance1: 98633
temperature2: 220
resistance2: 377
temperature3: 320
resistance3: 73

[extruder]
max_extrude_cross_section: 100
max_extrude_only_distance: 1000.0
step_pin: nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB8
sensor_type: my_thermistor
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.038
pressure_advance_smooth_time: 0.038
control: pid
pid_kp: 26.861
pid_ki: 3.035
pid_kd: 59.429
min_temp: -30
max_temp: 390

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 37
pid_Ki: 0.18
pid_Kd: 280
min_temp: -30
max_temp: 135

[heater_generic chamber_heater]
heater_pin: PC12
max_power: 1.0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC5
control: watermark
max_delta: 1.0
min_temp: -30
max_temp: 80

[ptc_power_limiter]
bed: heater_bed
chamber: heater_generic chamber_heater
max_combined_load: 1.35 # Tested with all heaters at 100%. 12A peak draw and less than 5A within 5 minutes.
bed_full_load: 1.0
chamber_full_load: 0.35
minimum_useful_chamber_power: 0.20

[verify_heater extruder]
check_gain_time: 60
heating_gain: 1.0

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[verify_heater chamber_heater]
max_error: 80
check_gain_time: 345600
hysteresis: 15
heating_gain: 1

# === Input shaper (fans: macros/fans.cfg, sensors: macros/sensors.cfg, LEDs: macros/leds.cfg) ===

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 50
shaper_type_y: mzv
shaper_freq_y: 50

