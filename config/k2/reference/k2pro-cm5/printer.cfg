
[danger_options]
log_statistics: True
log_config_file_at_startup: True
log_bed_mesh_at_startup: False
log_velocity_limit_changes: False
log_pressure_advance_changes: False
log_shutdown_info: True
log_serial_reader_warnings: True
log_startup_info: True
log_webhook_method_register_messages: False
multi_mcu_trsync_timeout: .1

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

[serial_485 serial485]
# Stable name of the T113 gadget interface: /dev/ttyUSBn changes when the
# gadget reconnects while Klipper still holds the old ports.
serial: /dev/serial/by-id/usb-Allwinner_Technology_Inc._Gadget_Serial-if02-port0
baud: 230400
# No device answering for this long (and 3 timeouts in a row) means the RS-485
# link is lost; Klipper alone would not notice behind the T113 bridge.
link_lost_timeout: 10
# During a print: pause (default), warn or shutdown. When idle: a warning.
link_lost_action: pause

[mcu]
# Stable name of the T113 gadget interface: /dev/ttyUSBn changes when the
# gadget reconnects while Klipper still holds the old ports.
serial: /dev/serial/by-id/usb-Allwinner_Technology_Inc._Gadget_Serial-if00-port0
baud: 230400
restart_method: command

[mcu nozzle_mcu]
# Stable name of the T113 gadget interface: /dev/ttyUSBn changes when the
# gadget reconnects while Klipper still holds the old ports.
serial: /dev/serial/by-id/usb-Allwinner_Technology_Inc._Gadget_Serial-if01-port0
baud: 230400
restart_method: command


[mcu rpi]
serial: /tmp/klipper_host_mcu


[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: -30
max_temp: 100

[temperature_sensor nozzle_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: nozzle_mcu
min_temp: -30
max_temp: 100

[duplicate_pin_override]
pins: PC5,PC7,PB7,PB8,PB9,PB10,PB5,PB6,PA1,PB15,PB11,PB12,PB13,PA10,PA9,PB2,PB14,PB3,PB1

[telemetry]
enabled: False

[virtual_sdcard]
path: /home/alfio/printer_data/gcodes
on_error_gcode: _RESET_PRINT_STATE

# K2 Pro power-loss recovery re-references Z through [z_align] (bottom switch),
# like the stock firmware. Recovery only starts on PLR_RECOVER CONFIRM=1;
# validate it with a supervised power cut first.
[power_loss_recovery]
# Durable print checkpoints for recovery after a power cut (PLR_STATUS,
# PLR_RECOVER, PLR_DISCARD). Values validated on the K2 Pro are marked.
# A/B journal directory (default: ~/printer_data/power_loss_recovery on the host).
state_path: ~/printer_data/power_loss_recovery
# How Z is found again: z_align = home to the K2 Pro bottom Z switch (validated).
z_reference: z_align
# Minimum seconds between in-memory checkpoint candidates.
candidate_interval: 0.5
# Minimum seconds between checkpoints written to disk.
checkpoint_interval: 10.0
# Clearance above the saved print height before moving, mm.
recovery_lift: 5.0
# Highest Z the recovery may use on the K2 Pro, mm (validated; Jacob's K2 Plus uses 350).
maximum_recovery_z: 295
# XY travel speed during recovery, mm/s.
recovery_travel_speed: 100.0
# Z speed during recovery, mm/s (validated on the single-Z K2 Pro).
recovery_z_speed: 10
# Nozzle temperature held while Z is referenced, C.
nozzle_standby: 140.0

# Serial link monitor (kalico-k2pro link_monitor): RTT percentiles of every
# MCU and RS-485, serialqueue counters, one CSV row per channel per minute.
[link_monitor]
interval: 60
log_path: ~/printer_data/logs/link_monitor.csv
# Benchmarks only: probe_hz: 10 adds round trips, raw_path logs every sample.
#probe_hz: 0
#raw_path:

[idle_timeout]
timeout: 99999999

[force_move]
enable_force_move: true

[force_stop_homing]

[gcode_arcs]
resolution: 0.1

[exclude_object]

[display_status]

[pause_resume]


# === Motion ===

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 10
square_corner_velocity: 10
max_z_accel: 300

[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA9
microsteps: 32
rotation_distance: 40
endstop_pin: PB11
position_endstop: 302
position_min: -13
position_max: 302
homing_speed: 150
second_homing_speed: 50
homing_retract_dist: 5
homing_accel: 1000

[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA8
microsteps: 32
rotation_distance: 40
endstop_pin: PB12
position_endstop: -6.5
position_min: -6.5
position_max: 332
homing_speed: 150
second_homing_speed: 50
homing_retract_dist: 5
homing_accel: 1000

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PA10
microsteps: 16 # stock K2 Pro; the MCU-driven z_align routine loses steps at 64
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 303
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 10 #0 for carto

[tmc2208 stepper_z]
uart_pin: PC1
run_current: 0.84
stealthchop_threshold: 0
sense_resistor: 0.100
interpolate: True # smooth 16-microstep Z (driver interpolates to 256)


# K2 Pro bottom photoelectric switch (Creality F012 stock: endstop_pin_z PA15).
# Used by integrated G28 when Z is unknown and by power-loss recovery to
# re-reference Z by dropping the bed away from the nozzle.
[z_align]
endstop_pin_z: PA15
zd_up: 1
zes_untrig: 1
# quick/slow speed and distances use Creality's MCU step units (gear ratio
# ignored, like the stock firmware): speed 6 is ~1.9 mm/s and rising_dist 10
# is ~3.1 mm on the K2 Pro.
quick_speed: 6
slow_speed: 6
rising_dist: 10
safe_dist: 40
filter_cnt: 10
timeout: 200 # a full ~300 mm drop at ~1.9 mm/s takes ~160 s
retries: 5
retry_tolerance: 10
zmax: 301 # stepper_z position_max 303 - Creality zmax_safe_pox_diff 2
rise_distance: 255 # ~0.85 x zmax (Creality distance_ratio), then PRTouch homes
rise_speed: 10 # K2 Pro max_z_velocity

[axis_twist_compensation]
speed: 80
horizontal_move_z: 5
calibrate_start_x: 10
calibrate_end_x: 275
calibrate_y: 150
calibrate_start_y: 22
calibrate_end_y: 258
calibrate_x: 150

[screws_tilt_adjust]
screw1: 8, 59
screw1_name: Front Left
screw2: 290, 59
screw2_name: Front Right
screw3: 290, 253
screw3_name: Rear Right
screw4: 8, 253
screw4_name: Rear Left
speed: 150
horizontal_move_z: 10
screw_thread: CW-M4


# === Heaters ===

[thermistor my_thermistor]
temperature1: 25
resistance1: 98633
temperature2: 220
resistance2: 377
temperature3: 320
resistance3: 73

[extruder]
max_extrude_cross_section: 100
max_extrude_only_distance: 1000.0
step_pin: nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 7.0207 #6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB8
sensor_type: PT1000
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.038
pressure_advance_smooth_time: 0.038
#control: pid
#pid_kp: 26.861
#pid_ki: 3.035
#pid_kd: 59.429
min_temp: -30
max_temp: 390

[thermistor R3men_bed]
temperature1: 25
resistance1: 100000
temperature2: 97
resistance2: 1385
temperature3: 248
resistance3: 165

[thermistor PT1000_CUSTOM]
temperature1: 25
resistance1: 1268.60
temperature2: 180
resistance2: 1920.98
temperature3: 300
resistance3: 2398.52


[heater_bed]
heater_pin: PC8
sensor_type: R3men_bed
sensor_pin: PC4
#control: pid
#pid_Kp: 37
#pid_Ki: 0.18
#pid_Kd: 280
min_temp: -30
max_temp: 135
max_power: 0.6

[heater_generic chamber_heater]
heater_pin: PC12
max_power: 1.0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC5
control: watermark
max_delta: 1.0
min_temp: -30
max_temp: 80

[ptc_power_limiter]
bed: heater_bed
chamber: heater_generic chamber_heater
max_combined_load: 1.0 # Tested with all heaters at 100%. 12A peak draw and less than 5A within 5 minutes.
bed_full_load: 0.6
chamber_full_load: 0.5
minimum_useful_chamber_power: 0.20

[verify_heater extruder]
check_gain_time: 60
heating_gain: 1.0

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[verify_heater chamber_heater]
max_error: 80
check_gain_time: 345600
hysteresis: 15
heating_gain: 1


# === Fans, LEDs, and outputs ===

[fan_feedback]

[fan]
pin: !nozzle_mcu:PB15
enable_pin: nozzle_mcu:PB6
cycle_time: 0.010
hardware_pwm: false
min_power: 0.10
shutdown_speed: 0

[multi_pin chamber_exhaust_fan_pins]
pins: PB1,PB3

[temperature_fan chamber_exhaust_fans]
pin: multi_pin:chamber_exhaust_fan_pins
cycle_time: 0.0100
hardware_pwm: false
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC5
control: watermark
target_temp: 0
max_delta: 0.5
min_temp: -30
max_temp: 80
max_speed: 1.0
min_speed: 0.0
shutdown_speed: 0

[temperature_fan_manual_floor chamber_exhaust_fans]

[temperature_sensor CM5-temp]
sensor_type: temperature_host
min_temp: -10
max_temp: 100

[multi_pin aux_fan_pins]
pins: PB4

[fan_generic aux_fans]
pin: multi_pin:aux_fan_pins
cycle_time: 0.0100
hardware_pwm: false
min_power: 0.35
kick_start_time: 1.0
shutdown_speed: 0

[controller_fan extruder_motor_fan]
pin: nozzle_mcu:PB1
stepper: 
heater: extruder
fan_speed: 1.0
idle_timeout: 30
shutdown_speed: 0

[heater_fan heatbreak_fan]
pin: nozzle_mcu:PB7
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
shutdown_speed: 1.0

[controller_fan ssr_board_fan]
pin: PA0
heater: heater_bed,chamber_heater
stepper:
fan_speed: 1.0
idle_speed: 0.5
idle_timeout: 30
shutdown_speed: 0.0

[chamber_heater_circulation_fan chamber_heater_fan]
pin: !PB14
enable_pin: PB2
heater: chamber_heater
# Fan speed while chamber heater PWM is active before print starts
preheat_speed: 1.0
# Fan speed while chamber heater PWM is during print(Creality always ran it at 30%)
printing_speed: 0.30

[multi_pin LED_pin]
pins: PB0,PA12

[output_pin LED]
pin: multi_pin:LED_pin
pwm: True
cycle_time: 0.010
value: 1

[led_idle_manager]
timeout: 300            # seconds of inactivity before LEDs switch off

# === Sensors ===

[filament_switch_sensor filament_sensor]
pause_on_runout: false
smart: true
runout_distance: 5.0 # mm available after the printhead sensor clears. box uses this to try and pause during infill to hide blemishes
switch_pin: ^!nozzle_mcu:PA11
runout_gcode:
  RESPOND TYPE=echo MSG="Filament sensor runout"
  BOX_RUNOUT_CHECK

[lis2dw]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: lis2dw
probe_points:
   150,150,10
min_freq: 20
max_freq: 120
accel_per_hz: 120
sweeping_period: 1.2
hz_per_sec: 1.0

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 48.8
shaper_type_y: mzv
shaper_freq_y: 40.8

