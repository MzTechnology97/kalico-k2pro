# Mainsail controls on virtual pins (Miscellaneous panel).
#
# Needs klipper-virtual-pins (https://github.com/pedrolamas/klipper-virtual-pins)
# linked into klippy/extras.
#
# Axis Twist Compensation: switch for the axis twist calibration at print
# start (START_PRINT). START_PRINT_ATC ENABLE=1|0 moves it from the console.
# Virtual pins restart from "value:", so every change is saved in
# save_variables (start_print.cfg) and restored after each Klipper start.
#
# Clog Detection: switch for the CFS clog check (extruder feeds, CFS does not
# refill). The CFS saves it in its own state (_BOX_SET_CLOG_DETECTION); the
# switch is put back to that state after each Klipper start. Until it is
# saved, clog_detection in box.cfg is the default.
#
# The Chamber Exhaust Fans slider is not here: it comes from
# [temperature_fan_manual_floor chamber_exhaust_fans] with generic_fan: True.
[virtual_pins]

[output_pin axis_twist_compensation]
pin: virtual_pin:axis_twist_compensation
value: 0

[output_pin clog_detection]
pin: virtual_pin:clog_detection
value: 1

[delayed_gcode _OPENHOST_CONTROLS_RESTORE]
initial_duration: 1
gcode:
  {% set saved = printer.save_variables.variables %}
  {% set value = saved.get('axis_twist_compensation', printer["gcode_macro _START_PRINT_VARS"].adaptive_axis_twist_comp)|int %}
  _SET_PIN_OPENHOST PIN=axis_twist_compensation VALUE={value}
  {% if 'box' in printer %}
    _SET_PIN_OPENHOST PIN=clog_detection VALUE={1 if printer.box.clog_detection_enabled else 0}
  {% endif %}

# Saves the switches whenever they change; every other SET_PIN passes through.
[gcode_macro SET_PIN]
rename_existing: _SET_PIN_OPENHOST
gcode:
  {% set pin = params.PIN|default("")|lower %}
  _SET_PIN_OPENHOST {rawparams}
  {% if 'VALUE' in params %}
    {% set enable = 1 if params.VALUE|float > 0 else 0 %}
    {% if pin == "axis_twist_compensation" %}
      SAVE_VARIABLE VARIABLE=axis_twist_compensation VALUE={enable}
    {% elif pin == "clog_detection" %}
      _BOX_SET_CLOG_DETECTION ENABLE={enable}
    {% endif %}
  {% endif %}
