[gcode_macro START_PRINT]
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set CHAMBER_MAX_DELTA = printer["configfile"]["config"]["heater_generic chamber_heater"].max_delta|float %}
  {% set MIN_CHAMBER_TEMP = params.MIN_CHAMBER_TEMP|default(CHAMBER_TEMP - CHAMBER_MAX_DELTA)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(220)|float %}
  {% set EXTRUDER_WAITTEMP = 140 %}
  {% set MATERIAL = params.MATERIAL|default("")|string %}
  {% set SOAK_TIME = params.SOAK_TIME|default(printer["gcode_macro _START_PRINT_VARS"].heat_soak)|float %}
  {% set HAS_PRTOUCH = 'prtouch' in printer %}
  {% set PRTOUCH_IS_PROBE = HAS_PRTOUCH and printer["configfile"]["config"]["prtouch"].register_as_probe|lower == 'true' %}
  {% set SAVED = printer.save_variables.variables if 'save_variables' in printer else {} %}
  {% set ATC_SWITCH = printer["output_pin axis_twist_compensation"].value if 'output_pin axis_twist_compensation' in printer
                      else SAVED.get('axis_twist_compensation', printer["gcode_macro _START_PRINT_VARS"].adaptive_axis_twist_comp) %}
  {% set ATC_ENABLED = params.ATC|default(ATC_SWITCH)|int %}
  {% set RUN_ATC = ATC_ENABLED and not PRTOUCH_IS_PROBE %}
  {% set RUN_SCRUB = HAS_PRTOUCH and printer["gcode_macro _START_PRINT_VARS"].prtouch_scrub|int %}
  {% set HOT_CLEAN_TEMP = EXTRUDER_TEMP - printer["gcode_macro _START_PRINT_VARS"].hot_clean_offset|float %}
  {% set HOT_CLEAN = printer["gcode_macro _START_PRINT_VARS"].hot_clean|int and HOT_CLEAN_TEMP > EXTRUDER_WAITTEMP + 20 %}

  {% macro bed_contact_prep(wt) %}
    {% if HOT_CLEAN %}
      _NOZZLE_HOT_CLEAN TEMP={HOT_CLEAN_TEMP} PROBE_TEMP={wt}
    {% endif %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Waiting for nozzle to reach {wt}C before probing..."
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={wt - 2} MAXIMUM={wt + 2}
    NOZZLE_CLEAN
    {% if RUN_SCRUB %}
      #PRTOUCH_SCRUB
    {% endif %}
  {% endmacro %}

  {% macro axis_twist_adaptive() %}
    {% set ATC_MARGIN = 10 %} # Keep >= bed mesh adaptive_margin.
    {% set ATC_SPACING = 60 %}
    {% set ATC_MIN_SAMPLES = 3 %}
    {% set cmd = "PRTOUCH_AXIS_TWIST_COMPENSATION" if HAS_PRTOUCH
                  else "CARTOGRAPHER_AXIS_TWIST_COMPENSATION" %}
    {% set xs = printer.exclude_object.objects | default([], true)
                | map(attribute='polygon') | sum(start=[]) | map(attribute=0) | list %}
    {% if not xs %}
      {cmd} AXIS=X
    {% else %}
      {% set cfg = printer["configfile"]["config"]["axis_twist_compensation"] | default({}, true) %}
      {% set x0 = [xs | min - ATC_MARGIN, cfg.get('calibrate_start_x') | default(0) | float] | max %}
      {% set x1 = [xs | max + ATC_MARGIN, cfg.get('calibrate_end_x') | default(350) | float] | min %}
      {% set nx = [(((x1 - x0) / ATC_SPACING + 1) | round(0, 'ceil')) | int, ATC_MIN_SAMPLES] | max %}
      {cmd} AXIS=X START={(x0 | round(2))} END={(x1 | round(2))} SAMPLE_COUNT={nx}
    {% endif %}
  {% endmacro %}

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Start print macro called with {params}"
  {% if ATC_ENABLED and PRTOUCH_IS_PROBE %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Axis twist calibration skipped: PRTouch probes with the nozzle"
  {% endif %}

  {% if CHAMBER_TEMP > 40 and MIN_CHAMBER_TEMP > CHAMBER_TEMP %}
    {action_raise_error("MIN_CHAMBER_TEMP cannot exceed CHAMBER_TEMP")}
  {% endif %}

  _RESET_PRINT_STATE

  parse_flush_volumes

  {% if MATERIAL == "" %}
    {% set OFFSET = printer["gcode_macro _START_PRINT_VARS"].offset_default %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="WARNING: Material type not passed into START_PRINT! Using default Z offset of {OFFSET}. See start_print.cfg for slicer setup." TYPE=error
  {% else %}
    {% set OFFSET = printer["gcode_macro _START_PRINT_VARS"].get("offset_" + MATERIAL|lower, printer["gcode_macro _START_PRINT_VARS"].offset_default) %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Setting Z offset of {OFFSET} for {MATERIAL}"
  {% endif %}
  SET_GCODE_OFFSET Z={OFFSET}

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Preheating: Nozzle={EXTRUDER_WAITTEMP}C Bed={BED_TEMP}C Chamber={CHAMBER_TEMP}C"
  M104 S{EXTRUDER_WAITTEMP}
  M140 S{BED_TEMP}
  M141 S{CHAMBER_TEMP}

  HOME_IF_NEEDED

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Waiting for bed to reach {BED_TEMP}°C..."
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 0.5} MAXIMUM={BED_TEMP + 1}

  {% set CHAMBER_ASSIST = CHAMBER_TEMP > 40 and MIN_CHAMBER_TEMP > 0 and BED_TEMP > MIN_CHAMBER_TEMP %}
  {% if CHAMBER_ASSIST %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Using aux fans for bed-assisted chamber heating..."
    SET_FAN_SPEED FAN=aux_fans SPEED=1
  {% endif %}

  # soak countdown
  {% for i in range(0, (SOAK_TIME * 60) | int, 60) %}
    {% set COUNTDOWN = (SOAK_TIME * 60) | int - i %}
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Soaking: {COUNTDOWN // 60} min {COUNTDOWN % 60} sec left"
    G4 P{(60000 if COUNTDOWN > 60 else COUNTDOWN * 1000)}
  {% endfor %}

  {% if CHAMBER_TEMP > 40 %} # M141/M191 select chamber heating mode only above 40C.
    STATUS_MSG PREFIX="[START_PRINT]:" MSG="Waiting for chamber to reach minimum {MIN_CHAMBER_TEMP}°C (target {CHAMBER_TEMP}°C)..."
    TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater" MINIMUM={MIN_CHAMBER_TEMP}
  {% endif %}
  {% if CHAMBER_ASSIST %}
    SET_FAN_SPEED FAN=aux_fans SPEED=0
  {% endif %}

  {% if RUN_ATC or PRTOUCH_IS_PROBE %}
    AXIS_TWIST_COMPENSATION_CLEAR
  {% endif %}

  {% if PRTOUCH_IS_PROBE %}
    {bed_contact_prep(EXTRUDER_WAITTEMP)}
  {% endif %}
  #Z_TILT_ADJUST

  {% if RUN_ATC %}
    {bed_contact_prep(EXTRUDER_WAITTEMP)}
    {axis_twist_adaptive()}
  {% endif %}

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Meshing bed"
  BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1
  {% if not (PRTOUCH_IS_PROBE or RUN_ATC) %}
    {bed_contact_prep(EXTRUDER_WAITTEMP)}
  {% endif %}
  {% if HAS_PRTOUCH %}
    PRTOUCH_HOME PRINT_TEMP={EXTRUDER_TEMP}
  {% else %}
    CARTOGRAPHER_TOUCH_HOME
  {% endif %}
  BOX_GO_TO_WASTEBIN

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Setting extruder to {EXTRUDER_TEMP}°C..."
  M104 S{EXTRUDER_TEMP}

  G92 E0

  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Start_Print macro has finished"

# === START_PRINT defaults: edit in overrides.cfg ===
[gcode_macro _START_PRINT_VARS]
variable_heat_soak: 0 # Bed heat-soak time in minutes.
variable_offset_DEFAULT: 0.00 # Fallback Z offset, in mm.
variable_adaptive_axis_twist_comp: 0 # Default of START_PRINT_ATC until it is saved: calibrate twist over the print area unless PRTouch is the probe. 0 disables.
variable_prtouch_scrub: 0 # Scrub the nozzle on the plate tab when PRTouch exists. 0 skips scrub only.
variable_hot_clean: 1 # Clean the nozzle hot before cooling it to the probing temperature. 0 cleans only at the probing temperature.
variable_hot_clean_offset: 10 # Hot clean temperature = print temperature minus this, in C.
variable_hot_clean_retract: 2.0 # Retract before the hot clean so the nozzle does not ooze, in mm. 0 disables.
gcode:

# Hot clean before probing: soft residue comes off at the material's
# temperature, then the nozzle cools to the probing temperature over the
# wastebin with the part fan at full speed. The final NOZZLE_CLEAN in
# START_PRINT's bed_contact_prep runs at the probing temperature.
[gcode_macro _NOZZLE_HOT_CLEAN]
description: Clean the nozzle hot over the wastebin, then cool it to the probing temperature
gcode:
  {% set temp = params.TEMP|float %}
  {% set probe_temp = params.PROBE_TEMP|float %}
  {% set retract = printer["gcode_macro _START_PRINT_VARS"].hot_clean_retract|float %}
  {% set fan_speed = printer.fan.speed|float %}
  BOX_GO_TO_WASTEBIN
  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Heating nozzle to {temp}C for a hot clean..."
  M104 S{temp}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 2}
  {% if retract > 0 %}
    SAVE_GCODE_STATE NAME=_NOZZLE_HOT_CLEAN
    M83
    G1 E-{retract} F1800
    RESTORE_GCODE_STATE NAME=_NOZZLE_HOT_CLEAN
  {% endif %}
  NOZZLE_CLEAN
  STATUS_MSG PREFIX="[START_PRINT]:" MSG="Cooling nozzle to {probe_temp}C over the wastebin..."
  M104 S{probe_temp}
  M106 P0 S255
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={probe_temp + 2}
  M106 P0 S{(fan_speed * 255)|round|int}

# Axis twist calibration at print start, switched on or off with
# START_PRINT_ATC ENABLE=1|0 or the Mainsail switch of
# axis_twist_switch.cfg, and kept across restarts in save_variables.
# Without a saved value, variable_adaptive_axis_twist_comp is the default.
# PRTouch as the probe touches the bed with the nozzle, so there is no twist
# to compensate; the switch then only reports that.
[save_variables]
filename: ~/printer_data/config/k2_start_print_variables.cfg

[gcode_macro START_PRINT_ATC]
description: Axis twist calibration at print start: ENABLE=1 on, ENABLE=0 off (saved); no ENABLE shows the state
gcode:
  {% set saved = printer.save_variables.variables %}
  {% set default = printer["gcode_macro _START_PRINT_VARS"].adaptive_axis_twist_comp|int %}
  {% if 'ENABLE' in params %}
    {% set enable = params.ENABLE|int %}
    {% if enable not in [0, 1] %}
      {action_raise_error("START_PRINT_ATC: ENABLE must be 0 or 1")}
    {% endif %}
    {% if 'output_pin axis_twist_compensation' in printer %}
      SET_PIN PIN=axis_twist_compensation VALUE={enable}
    {% else %}
      SAVE_VARIABLE VARIABLE=axis_twist_compensation VALUE={enable}
    {% endif %}
  {% elif 'output_pin axis_twist_compensation' in printer %}
    {% set enable = printer["output_pin axis_twist_compensation"].value|int %}
  {% else %}
    {% set enable = saved.get('axis_twist_compensation', default)|int %}
  {% endif %}
  {% set has_prtouch = 'prtouch' in printer %}
  {% set prtouch_is_probe = has_prtouch and printer["configfile"]["config"]["prtouch"].register_as_probe|lower == 'true' %}
  {% if prtouch_is_probe %}
    {% set mode = "not used: PRTouch probes with the nozzle, there is no twist to compensate" %}
  {% elif has_prtouch %}
    {% set mode = "PRTouch reference with the Cartographer scan" %}
  {% else %}
    {% set mode = "Cartographer touch" %}
  {% endif %}
  RESPOND MSG="Axis twist calibration at print start: {'on' if enable else 'off'} ({mode})"
