# System features: print files, power-loss recovery, link monitor,
# timeouts, arcs, object exclusion and pause/resume.

[telemetry]
enabled: False

[virtual_sdcard]
path: /home/alfio/printer_data/gcodes
on_error_gcode: _RESET_PRINT_STATE

# K2 Pro power-loss recovery re-references Z through [z_align] (bottom switch),
# like the stock firmware. Recovery only starts on PLR_RECOVER CONFIRM=1;
# validate it with a supervised power cut first.
 # Durable print checkpoints for recovery after a power cut (PLR_STATUS,
# PLR_RECOVER, PLR_DISCARD). Values validated on the K2 Pro are marked.
# A/B journal directory (default: ~/printer_data/power_loss_recovery on the host).
#[power_loss_recovery]
#state_path: ~/printer_data/power_loss_recovery
#z_reference: z_align # How Z is found again: z_align = home to the K2 Pro bottom Z switch (validated).
#candidate_interval: 0.5 # Minimum seconds between in-memory checkpoint candidates.
#checkpoint_interval: 10.0 # Minimum seconds between checkpoints written to disk.
#recovery_lift: 5.0 # Clearance above the saved print height before moving, mm.
#maximum_recovery_z: 295 # Highest Z the recovery may use on the K2 Pro, mm (validated; Jacob's K2 Plus uses 350).
#recovery_travel_speed: 100.0 # XY travel speed during recovery, mm/s.
#recovery_z_speed: 10 # Z speed during recovery, mm/s (validated on the single-Z K2 Pro).
#nozzle_standby: 140.0 # Nozzle temperature held while Z is referenced, C.

# Serial link monitor (kalico-k2pro link_monitor): RTT percentiles of every
# MCU and RS-485, serialqueue counters, one CSV row per channel per interval.
# Benchmark mode for the USB bridge tests: probe_hz 10 and raw samples.
# For long prints keep probe_hz: 0 and remove raw_path (no extra traffic).
#[link_monitor]
#interval: 60 # Serial link round trips and counters, one CSV row per channel per minute.
#log_path: ~/printer_data/logs/link_monitor.csv

[idle_timeout]
timeout: 99999999

[force_move]
enable_force_move: true

[force_stop_homing]

[gcode_arcs]
resolution: 0.1

[exclude_object]

[display_status]

[pause_resume]
