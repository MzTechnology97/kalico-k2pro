# Sensors: MCU and host temperatures, the printhead filament sensor,
# the nozzle accelerometer and the resonance tester. Fan tachometers:
# fans.cfg. [input_shaper] stays in printer.cfg (SAVE_CONFIG writes it).

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: -30
max_temp: 100

[temperature_sensor nozzle_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: nozzle_mcu
min_temp: -30
max_temp: 100

[temperature_sensor CM5-temp]
sensor_type: temperature_host
min_temp: -10
max_temp: 100

[filament_switch_sensor filament_sensor]
pause_on_runout: false
smart: true
runout_distance: 5.0 # mm available after the printhead sensor clears. box uses this to try and pause during infill to hide blemishes
switch_pin: ^!nozzle_mcu:PA11
runout_gcode:
  RESPOND TYPE=echo MSG="Filament sensor runout"
  BOX_RUNOUT_CHECK

[lis2dw]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: x,z,y
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[resonance_tester]
accel_chip: lis2dw
probe_points:
   150,150,10
min_freq: 20
max_freq: 120
accel_per_hz: 100
sweeping_period: 1.2
hz_per_sec: 1.0
