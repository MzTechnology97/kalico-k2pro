# Calibration and maintenance: rail lubrication, PID, motion stress tests.

# ----------------------------------------------------------------------
# Maintenance
# ----------------------------------------------------------------------
[gcode_macro LUBRICATE_RAILS]
gcode:
  {% set ITERATIONS = params.ITERATIONS|default(1)|int %}
  {% set SPEED_MM_S = params.SPEED|default(500)|float %}
  {% set SPEED_MM_MIN = SPEED_MM_S * 60 %}

  HOME_IF_NEEDED
  G1 Z10 F3000

  {% for i in range(ITERATIONS) %}
    STATUS_MSG MSG="Lubricating rails, iteration {i + 1} of {ITERATIONS}..."
    G1 X0 Y0 Z10 F{SPEED_MM_MIN}
    G1 X300 Y300 Z10 F{SPEED_MM_MIN}
    G1 X0 Y300 Z10 F{SPEED_MM_MIN}
    G1 X300 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y0 Z300 F3000
    G1 X300 Y300 Z10 F3000
    G1 X300 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y0 Z10 F{SPEED_MM_MIN}
    G1 X0 Y300 Z10 F{SPEED_MM_MIN}
    G1 X300 Y300 Z10 F{SPEED_MM_MIN}
  {% endfor %}

# ----------------------------------------------------------------------
# PID calibration
# ----------------------------------------------------------------------
[gcode_macro BEDPID]
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET=100
  SAVE_CONFIG

[gcode_macro NOZZLE_PID]
gcode:
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET=230
  SAVE_CONFIG
  M107

[gcode_macro NOZZLE_PID_HIGH]
gcode:
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET=280
  SAVE_CONFIG
  M107

# ----------------------------------------------------------------------
# Motion stress tests (from useful-macros.cfg and dynamic.cfg, K2 Pro)
#
# Moves stay on the print bed: X from 10 mm to 300 mm and Y up to
# [extended_zone_transform] standard_y_max (301 mm). Past that Y the K2
# only allows X 122-230 (wastebin and brush). Kalico has no ACCEL_TO_DECEL;
# the configured minimum_cruise_ratio applies. Each test restores the
# configured velocity and acceleration when it ends.
# ----------------------------------------------------------------------
[gcode_macro _MOTION_TEST_RESTORE]
description: Back to the configured velocity, acceleration and cruise ratio.
gcode:
  {% set cfg = printer.configfile.settings.printer %}
  SET_VELOCITY_LIMIT VELOCITY={cfg.max_velocity} ACCEL={cfg.max_accel} MINIMUM_CRUISE_RATIO={cfg.minimum_cruise_ratio|default(0.5)}

[gcode_macro WARMUP]
description: Stress test: X, Y and diagonal sweeps over the bed. WARMUP [LOOPS=3] [X_ACCEL_MAX=10000] [Y_ACCEL_MAX=10000]
gcode:
  {% set loop_cnt = [params.LOOPS|default(3)|int, 2]|max %}
  {% set maxx = params.X_ACCEL_MAX|default(10000)|int %}
  {% set maxy = params.Y_ACCEL_MAX|default(10000)|int %}
  {% set maxd = [((maxx ** 2 + maxy ** 2) ** 0.5)|round|int, printer.configfile.settings.printer.max_accel|int]|min %}
  {% set ez = printer.configfile.settings["extended_zone_transform"]|default({}) %}
  {% set area = {"x_max": [printer.toolhead.axis_maximum.x|float, 300.0]|min,
                 "y_max": ez.standard_y_max|default(printer.toolhead.axis_maximum.y)|float} %}
  {% set max_x = (area.x_max - 5)|int %}
  {% set max_y = (area.y_max - 15)|int %}
  {% set loop_step_x = max_x // (loop_cnt - 1) %}
  {% set loop_step_y = max_y // (loop_cnt - 1) %}
  {% set x_park = area.x_max - 10.0 %}
  {% set y_park = area.y_max / 2 %}
  HOME_IF_NEEDED
  G90
  G1 Z10 F600

  SET_VELOCITY_LIMIT ACCEL={maxx}
  {% for number in range(10, max_y + 11, loop_step_y) %}
    {% set y = [number, max_y]|min %}
    G1 F{maxy} X10 Y{y}
    G1 F{maxx} X{max_x} Y{y}
  {% endfor %}

  SET_VELOCITY_LIMIT ACCEL={maxy}
  {% for number in range(10, max_x + 11, loop_step_x) %}
    {% set x = [number, max_x]|min %}
    G1 F{maxy} X{x} Y{max_y}
    G1 F{maxy} X{x} Y10
  {% endfor %}

  SET_VELOCITY_LIMIT ACCEL={maxd}
  {% for times in range(loop_cnt) %}
    G1 F{maxx} X10 Y10
    G1 F{maxd} X{max_x} Y{max_y}
    G1 F{maxx} X10 Y{max_y}
    G1 F{maxd} X{max_x} Y10
    G1 F{maxy} X{max_x} Y{max_y}
    G1 F{maxd} X10 Y10
    G1 F{maxy} X10 Y{max_y}
    G1 F{maxd} X{max_x} Y10
  {% endfor %}

  SET_VELOCITY_LIMIT ACCEL={maxx}
  {% for times in range(loop_cnt) %}
    G1 F{maxy} X10 Y10
    G1 F{maxy} X10 Y{max_y}
    G1 F{maxx} X{max_x} Y{max_y}
    G1 F{maxy} X{max_x} Y10
    G1 F{maxx} X10 Y10
    G1 F{maxx} X{max_x} Y10
    G1 F{maxy} X{max_x} Y{max_y}
    G1 F{maxx} X10 Y{max_y}
  {% endfor %}
  G1 X{x_park} Y{y_park} F30000
  _MOTION_TEST_RESTORE

[gcode_macro AUTO_WARMUP]
description: Long burn-in: WARMUP at three accelerations with 20 min pauses, CYCLES times. AUTO_WARMUP [CYCLES=3]
gcode:
  {% for cycle in range(params.CYCLES|default(3)|int) %}
    WARMUP LOOPS=85 X_ACCEL_MAX=15000 Y_ACCEL_MAX=15000
    G4 S1200
    WARMUP LOOPS=85 X_ACCEL_MAX=10000 Y_ACCEL_MAX=10000
    G4 S1200
    WARMUP LOOPS=85 X_ACCEL_MAX=5000 Y_ACCEL_MAX=18000
    G4 S1200
  {% endfor %}

[gcode_macro TEST_SPEED]
description: Skipped-step test: GET_POSITION before and after fast patterns. TEST_SPEED [SPEED] [ACCEL] [ITERATIONS=5] [BOUND=25] [SMALLPATTERNSIZE=20]
gcode:
  {% set cfg = printer.configfile.settings.printer %}
  {% set speed = params.SPEED|default(cfg.max_velocity)|int %}
  {% set iterations = params.ITERATIONS|default(5)|int %}
  {% set accel = params.ACCEL|default(cfg.max_accel)|int %}
  {% set bound = params.BOUND|default(25)|int %}
  {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}
  {% set ez = printer.configfile.settings["extended_zone_transform"]|default({}) %}
  {% set area = {"x_max": [printer.toolhead.axis_maximum.x|float, 300.0]|min,
                 "y_max": ez.standard_y_max|default(printer.toolhead.axis_maximum.y)|float} %}

  # Large pattern, inset by BOUND inside the bed area
  {% set x_min = 0 + bound %}
  {% set x_max = area.x_max - bound %}
  {% set y_min = 0 + bound %}
  {% set y_max = area.y_max - bound %}

  # Small pattern at the center
  {% set x_center = area.x_max / 2 %}
  {% set y_center = area.y_max / 2 %}
  {% set x_center_min = x_center - (smallpatternsize / 2) %}
  {% set x_center_max = x_center + (smallpatternsize / 2) %}
  {% set y_center_min = y_center - (smallpatternsize / 2) %}
  {% set y_center_max = y_center + (smallpatternsize / 2) %}

  SAVE_GCODE_STATE NAME=TEST_SPEED
  { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }

  # Home, then measure the position at the bed corner
  M400
  HOME_IF_NEEDED
  G90
  G1 X{area.x_max - 50} Y{area.y_max - 50} F{30 * 60}
  M400
  G28 X Y
  G0 X{area.x_max - 1} Y{area.y_max - 1} F{30 * 60}
  G4 P1000
  GET_POSITION

  G0 X{x_min} Y{y_min} Z{bound + 10} F{speed * 60}
  SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}

  {% for i in range(iterations) %}
    # Large pattern diagonals
    G0 X{x_min} Y{y_min} F{speed * 60}
    G0 X{x_max} Y{y_max} F{speed * 60}
    G0 X{x_min} Y{y_min} F{speed * 60}
    G0 X{x_max} Y{y_min} F{speed * 60}
    G0 X{x_min} Y{y_max} F{speed * 60}
    G0 X{x_max} Y{y_min} F{speed * 60}
    # Large pattern box
    G0 X{x_min} Y{y_min} F{speed * 60}
    G0 X{x_min} Y{y_max} F{speed * 60}
    G0 X{x_max} Y{y_max} F{speed * 60}
    G0 X{x_max} Y{y_min} F{speed * 60}
    # Small pattern diagonals
    G0 X{x_center_min} Y{y_center_min} F{speed * 60}
    G0 X{x_center_max} Y{y_center_max} F{speed * 60}
    G0 X{x_center_min} Y{y_center_min} F{speed * 60}
    G0 X{x_center_max} Y{y_center_min} F{speed * 60}
    G0 X{x_center_min} Y{y_center_max} F{speed * 60}
    G0 X{x_center_max} Y{y_center_min} F{speed * 60}
    # Small pattern box
    G0 X{x_center_min} Y{y_center_min} F{speed * 60}
    G0 X{x_center_min} Y{y_center_max} F{speed * 60}
    G0 X{x_center_max} Y{y_center_max} F{speed * 60}
    G0 X{x_center_max} Y{y_center_min} F{speed * 60}
  {% endfor %}

  _MOTION_TEST_RESTORE

  # Re-home X/Y and measure again: a difference means skipped steps
  M400
  G28 X Y
  G90
  G0 X{area.x_max - 1} Y{area.y_max - 1} F{30 * 60}
  G4 P1000
  GET_POSITION

  RESTORE_GCODE_STATE NAME=TEST_SPEED

[gcode_macro ACCELL_TEST_X]
description: Acceleration ramp on the X-heavy diagonal, 1000 mm/s^2 more each pass. ACCELL_TEST_X [STEPS=100] [VELOCITY=1000]
gcode:
  {% set steps = params.STEPS|default(100)|int %}
  {% set speed = params.VELOCITY|default(1000)|float * 60 %}
  {% set inset = 25.0 %}
  {% set accel = 10000 %}
  {% set ez = printer.configfile.settings["extended_zone_transform"]|default({}) %}
  {% set area = {"x_max": [printer.toolhead.axis_maximum.x|float, 300.0]|min,
                 "y_max": ez.standard_y_max|default(printer.toolhead.axis_maximum.y)|float} %}
  {% set minX = inset %}
  {% set minY = inset %}
  {% set maxX = area.x_max - inset %}
  {% set maxY = area.y_max - inset %}
  SAVE_GCODE_STATE NAME=accelltest_state
  HOME_IF_NEEDED
  G90
  G1 Z5 F600
  SET_VELOCITY_LIMIT ACCEL={accel}
  G1 X{minX} Y{minY} F{speed}
  {% for INTERVAL in range(steps) %}
    SET_VELOCITY_LIMIT ACCEL={accel + (INTERVAL * 1000)}
    G1 X{minX} Y{minY} F{speed}
    G1 X{maxX} Y{maxY} F{speed}
  {% endfor %}
  _MOTION_TEST_RESTORE
  RESTORE_GCODE_STATE NAME=accelltest_state

[gcode_macro ACCELL_TEST_Y]
description: Acceleration ramp on the other diagonal, 1000 mm/s^2 more each pass. ACCELL_TEST_Y [STEPS=100] [VELOCITY=1000]
gcode:
  {% set steps = params.STEPS|default(100)|int %}
  {% set speed = params.VELOCITY|default(1000)|float * 60 %}
  {% set inset = 20.0 %}
  {% set accel = 10000 %}
  {% set ez = printer.configfile.settings["extended_zone_transform"]|default({}) %}
  {% set area = {"x_max": [printer.toolhead.axis_maximum.x|float, 300.0]|min,
                 "y_max": ez.standard_y_max|default(printer.toolhead.axis_maximum.y)|float} %}
  {% set minX = inset %}
  {% set minY = inset %}
  {% set maxX = area.x_max - inset %}
  {% set maxY = area.y_max - inset %}
  SAVE_GCODE_STATE NAME=accelltest_state
  HOME_IF_NEEDED
  G90
  G1 Z5 F600
  SET_VELOCITY_LIMIT ACCEL={accel}
  G1 X{minX} Y{minY} F{speed}
  {% for INTERVAL in range(steps) %}
    SET_VELOCITY_LIMIT ACCEL={accel + (INTERVAL * 1000)}
    G1 X{maxX} Y{minY} F{speed}
    G1 X{minX} Y{maxY} F{speed}
  {% endfor %}
  _MOTION_TEST_RESTORE
  RESTORE_GCODE_STATE NAME=accelltest_state
