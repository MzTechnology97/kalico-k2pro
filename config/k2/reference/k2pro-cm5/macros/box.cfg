[box]
observation_mode: false
box_count: 1
#box_count: 4                           # Maximum CFS discovery target (1-4). Enumeration stops once this count is reached; setting to exact connected count avoids polling missing units and speeds up startup.
state_path: /home/alfio/printer_data/filament_box.json  # Persistent Box state, slot assignments, RFID estimates, and custom profiles.
material_database_path: /home/alfio/printer_data/config/k2_rfid_custom_materials.json
auto_register_rfid_filaments: true
auto_bambu_rfid_fallback: true             # API7 only: stock Creality RFID stays primary; Bambu is a fallback for unknown tags.
rfid_fallback_budget: 1                  # Third-party RFID: stock CFS rereads (~45 s each) per spool insertion; known UIDs come from a cache.
rfid_fallback_manual_budget: 3           # Rereads per slot on a manual _BOX_RFID_READ_SLOT.
auto_seed_material_database: true
purge_speed: 20                        # Volumetric flow rate (mm^3/s) for purges.
hotend_feed_speed: 20                  # Volumetric flow rate (mm^3/s) from gears to hotend.
hotend_feed_length: 63                 # Distance (mm) advanced to hotend after CFS load.
print_prime_speed: 10                  # Volumetric flow rate (mm^3/s) for prime moves.
print_prime_length: 20                 # Distance (mm) primed when no purge runs.
fallback_purge_length: 100             # Distance (mm) purged without slicer matrix or on same-slot change.
default_temp: 220                      # Fallback nozzle temp (°C) when unspecified.
retract_length: 20 #30                     # Distance (mm) retracted before cutting during unloads.
retract_velocity: 6000.0 #3000.0               # Extruder retract/snap/cut-assist feedrate (mm/min).
external_feed_velocity: 600.0          # Slow extruder feedrate (mm/min) for external insert and runout tail.
toolchange_z_hop: 2.0                  # Relative Z clearance (mm) for toolchange travel moves.

clean_pad_left_x: 155                  # Silicone pad left X edge.
clean_pad_right_x: 165                 # Silicone pad right X edge.
clean_pad_front_y: 324                 # Silicone pad front Y edge.
clean_pad_back_y: 332                  # Silicone pad back Y edge.
clean_pad_passes: 1                    # Complete silicone scrub passes.
wastebin_pos_x: 124.0                  # Wastebin X coordinate.
wastebin_pos_y: 329.0                  # Wastebin Y coordinate.
filament_retry_moves: Y300, X300, Y50, X50 # Wastebin-to-wastebin moves before retrying a stalled load or blocked unload. K2 Pro: Y max 332, X max 302 (the K2 Plus default Y350 is out of range).
travel_velocity: 18000.0               # XY travel feedrate (mm/min) for wastebin, cut approach/return, and service moves.
z_velocity: 600.0                      # Z lift/lower feedrate (mm/min) for cut clearance and toolchange hops.
clean_velocity: 9000.0                 # Cleaning move feedrate (mm/min).
snap_fan_speed: 1.0                    # Part-fan speed during flush-clean-snap, 0-1.
snap_fan_dwell_ms: 3000                # Part-fan dwell before snap retract, ms.
clog_detection: True                   # Default of the Clog Detection switch: pause when the extruder feeds but the CFS stops refilling. _BOX_SET_CLOG_DETECTION ENABLE=0|1 saves a runtime value.
clog_extruder_length: 80               # Extruder feed (mm) with no CFS refill before pausing; 30 minimum (one CFS refill chunk is ~25-30 mm).
notify_macro: _BOX_NOTIFY                # CFS events (runout swap, runout pause, clog, CFS error, unknown tag, low filament, humidity) go to this macro; empty = off.
cfs_live_remaining: True              # Follow live CFS type-4 remaining when firmware supports it; G-code estimate remains fallback.
humidity_warnings: True                  # Warn at print start when a mapped spool sits in a CFS more humid than its material tolerates (PLA 55 %, PETG 50 %, TPU 40 %, PC 35 %, PA 25 %, PVA 20 %...).
#humidity_limits: PA:15, PLA:45          # Override the humidity limit (%) of single materials.

pre_cut_pos_x: 10.0                    # X approach/return position for cutter strokes.
cut_pos_x: -10.6000  #written by CALIBRATE_CUT_POS; full actuation X position.
cut_pos_y: 200.0                       # Y coordinate held during cutter strokes.
cut_velocity: 30000.0                  # Cutter actuation move feedrate (mm/min).
pre_cut_cal_pos_x: -5.0                # Initial X probe position for CALIBRATE_CUT_POS.
check_cut_pos_x_max: -6.5              # Upper X bound for cutter calibration motor hits.
check_cut_pos_x_min: -10               # Lower X bound for cutter calibration search range.


# CFS runtime configuration: K2OH CFG5T (revision v323-cfg5t, feature 0xE5).
# Writes are supported ONLY by the matching K2-OpenHost firmware.
# CFG4 (v323-cfg4, 0xD7) supports only IDs 1/2/3/5/7/8; stock and OCFS get NO CFG5T SET.
# CFG5T effective SET callsites: IDs 1,2,3,5,7,8,20,22. All other IDs below are GET-only.
# Apply only during Klipper startup from this CFG; never via console or during a print.
# Times are host milliseconds; firmware converts ID8 /10 and IDs20/22 /20 into stock ticks.
# Values are volatile RAM. Firmware reset requires re-application at the next Klipper start.
# Leave auto_apply False until the supervised RS-485/print test is completed.
# Full IT/EN docs: https://github.com/MzTechnology97/k2-cfs-rfid-tools/tree/main/firmware/v3.24-cfg5t
[box_cfs_runtime]
auto_apply: False                      # Disabled for hardware validation: NO values sent to CFS
#address: 1                            # Optional: target a single CFS; omit to use all online units

# --- CFG5T: effective settings (8 live firmware callsites) ---
hub_forward_speed: 100               # ID1  stock 100   | range 1..255 | Hub forward movement speed
hub_transition_speed: 220            # ID2  stock 200   | range 1..255 | Hub transfer speed towards the buffer
hub_insert_speed: 100                # ID3  stock 155   | range 1..255 | Hub insertion speed
hub_reverse_speed: 150               # ID5  stock 80    | range 1..255 | Hub reverse / unload speed
hub_transition_wait_ms: 3200         # ID7  stock 3200  | range 100..10000 | Wait after hub transfer (milliseconds)
insert_sensor_timeout_ms: 7000       # ID8  stock 7000  | range 1000..50000, exact 10 ms steps | Insertion sensor timeout (milliseconds; step 10 ms)
feed_total_timeout_ms: 25000         # ID20 stock 25000 | range 5000..60000, exact 20 ms steps | Feed stage-4 total timeout (milliseconds; step 20 ms)
odometer_stall_timeout_ms: 500       # ID22 stock 500   | range 100..2000, exact 20 ms steps | Odometer stall timeout (milliseconds; step 20 ms)

# --- CFG5T: read-only / NO effective firmware SET hook (values kept for reference) ---
# Uncommenting these options does not activate the stock callsite; leave commented.
# feeder_forward_speed: 255          # ID0  stock 255   | range 1..255 | Feeder forward motor is GPIO ON/OFF; there is no speed regulator
# feeder_reverse_speed: 255          # ID4  stock 255   | range 1..255 | Feeder reverse motor is GPIO ON/OFF; no speed regulator
# reverse_detooth_enable: true       # ID6  stock 1     | range 0..1 | Reverse de-tooth toggle; not hooked by CFG5T
# hub_pullback_timeout_ms: 5000      # ID9  stock 5000  | range 500..15000 | Hub pullback timeout; stock hook not installed in CFG5T
# unload_sensor_timeout_ms: 1000     # ID10 stock 1000  | range 100..5000 | Unload sensor timeout; stock path is unreachable
# rfid_seek_speed: 160               # ID11 stock 160   | range 1..255 | RFID tag seek speed; no CFG5T hook
# rfid_measure_speed: 150            # ID12 stock 120   | range 1..255 | RFID measurement speed; no CFG5T hook; previous value 150 NOT applied
# rfid_reposition_speed: 100         # ID13 stock 100   | range 1..255 | RFID reposition speed; no CFG5T hook
# rfid_seek_move_ms: 800             # ID14 stock 800   | range 100..5000 | RFID seek movement duration; no CFG5T hook
# rfid_seek_settle_ms: 200           # ID15 stock 200   | range 10..2000 | RFID settling interval; no CFG5T hook
# rfid_post_auth_wait_ms: 1000       # ID16 stock 1000  | range 100..5000 | RFID post-auth delay; no CFG5T hook
# rfid_pre_measure_settle_ms: 400    # ID17 stock 400   | range 1..2000 | Pause before RFID measurement; stock default corrected to 400 ms; no CFG5T hook
# rfid_neighbor_detect_delay_ms: 400 # ID18 stock 400   | range 50..2000 | Neighbour spool detection delay; no CFG5T hook
# rfid_neighbor_settle_ms: 100       # ID19 stock 100   | range 10..1000 | Neighbour spool settle time; no CFG5T hook
# feed_recovery_timeout_ms: 3000     # ID21 stock 3000  | range 500..10000 | Feed recovery timeout; no CFG5T hook
# rfid_neighbor_retry_count: 1       # ID23 stock 3     | range 1..10 | RFID neighbour detection retries; no CFG5T hook; previous value 1 NOT applied
# reverse_detooth_timeout_ms: 1000   # ID24 stock 1000  | range 100..10000 | Reverse de-tooth timeout; no CFG5T hook
# buffer_fill_timeout_ms: 30000      # ID25 stock 30000 | range 1000..60000 | Buffer fill timeout; stock path is unreachable
# transition_detect_timeout_ms: 300  # ID26 stock 300   | range 50..5000 | Transition detection timeout; stock path is unreachable
# load_retry_count: 1                # ID27 stock 3     | range 1..10 | Load/retry cycles; no CFG5T hook; previous value 1 NOT applied

# CFS event notifications, called by Box with EVENT, TITLE and MESSAGE.
# Events: runout_swap, runout, clog, cfs_error, rfid_unknown, low_filament,
# humidity.
# Keep in `events` the ones you want; turn off what you do not use.


[gcode_macro _BOX_NOTIFY]
description: Forward a CFS event to Mobileraker and the Telegram bot
variable_events: "runout_swap,runout,clog,cfs_error,rfid_unknown,low_filament,humidity"
variable_mobileraker: True   # mobileraker_companion: MR_NOTIFY:title|message
variable_telegram: True      # moonraker-telegram-bot: RESPOND PREFIX=tgnotify
gcode:
    {% set event = params.EVENT|default("")|lower %}
    {% set title = params.TITLE|default("CFS") %}
    {% set message = params.MESSAGE|default("") %}
    {% if event in events.split(",") %}
        {% if mobileraker %}
            {action_respond_info("MR_NOTIFY:%s|%s" % (title, message))}
        {% endif %}
        {% if telegram %}
            RESPOND PREFIX=tgnotify MSG="{title}: {message}"
        {% endif %}
    {% endif %}

# K2 Pro CFS 1.1.3 four-byte BOX_STATE compatibility
#[box_k2pro]

[box_environment]
poll_interval: 5.0

[box_print_mapping]
auto_map_prints: true                  # Safe backend auto-map for ordinary Moonraker/Orca starts. Enable after slot inventory is populated.
auto_map_block_unresolved: true         # Reject a direct start when one or more slicer tools cannot be matched safely.


[external_rfid_reader]
beep_enabled: true                     # Sound buzzer on successful RFID scan.
beep_backend: t113                     # K2-OpenHost: the buzzer is on the T113 ([k2_t113]); stock K2: local.

[extended_zone_transform] #LT: Estimated for now.
standard_y_max: 301.0                  # Print-bed Y max; beyond this is the rear service zone.
extended_y_max: 332.0                  # Absolute Y max including brush/wastebin.
safe_x_min: 122.0                      # Min X allowed while Y is past standard_y_max.
safe_x_max: 230.0                      # Max X allowed while Y is past standard_y_max.

[motion_limits]
# Loads save/restore helpers for temporary toolchange motion limits.

