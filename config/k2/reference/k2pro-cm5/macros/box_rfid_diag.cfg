# Optional CFS RFID diagnostic adapter.
#
# The shared RS-485 device remains owned by Serial_485_Wrapper. This module
# never opens /dev/k2-rs485 directly.
[box_rfid_diag]
serial: serial485
address: 1

# Direct diagnostic POLL/READ/AUTH commands remain disabled by default.
# API7 Bambu stock-capture does not use these direct-RF commands: it arms a
# one-shot key override and lets Creality's original CFS RFID task do the RF.
allow_active_rf: false
require_idle: true
