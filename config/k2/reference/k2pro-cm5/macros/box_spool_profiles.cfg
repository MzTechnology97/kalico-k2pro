# Bambu R3 reference geometry; circumferences in mm.
# Full reference: measured C508.253 -> 508.3.
# Effective core C284.7 calibrated from 19655/327000 consumption to runout.
# Bare cardboard diameter about83mm (C260.8) overestimated the initial quantity.
# Effective core includes measurement/model bias; it is not a physical diameter.
[box_spool_profiles]
serial: serial485
enabled: True
single_cycle_rfid: True
handoff_wait_ms: 3000
handoff_lease_ms: 10000
reconcile_interval: 5.0
vendor_geometries:
    bambu = 1, 284.7, 508.3
