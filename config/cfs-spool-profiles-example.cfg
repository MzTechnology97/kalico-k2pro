# CFS CFG6 SGF1/RH1 R3: vendor geometry and single-cycle RFID.
# Standalone example: copy once to macros/box_spool_profiles.cfg and enable it.
# Paired firmware: a6dec25c74e7d259eec0387193548a0c3cc78ec9fc4ddc35824f0fe0965385b8.
# Reference Bambu refill: cardboard OUTER diameter about 83 mm -> C=260.8 mm.
# Full reference: new 1 kg PETG HF spool, measured C=508.253 mm -> 508.3 mm.
# Geometry values below are CIRCUMFERENCES in mm, not diameters.
# Values are a measured starting profile; recalibrate for a different support.
# Guide: docs/CFS_SPOOL_CALIBRATION.md (Italiano).
[box_spool_profiles]
serial: serial485
enabled: False
single_cycle_rfid: True
handoff_wait_ms: 3000
handoff_lease_ms: 10000
reconcile_interval: 5.0
vendor_geometries:
    bambu = 1, 260.8, 508.3
