name: K2 OpenHost - one-shot startup hardening

on:
  push:
    branches: [k2-pro-openhost]
    paths:
      - .github/workflows/k2-openhost-startup-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k2-pro-openhost
          fetch-depth: 0

      - name: Patch motor-control startup timing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('klippy/extras/motor_control.py')
          s = p.read_text()

          def rep(old, new, count=1):
              global s
              if old not in s:
                  raise SystemExit(f'marker not found: {old[:120]!r}')
              s = s.replace(old, new, count)

          rep('''CONTROL_OPTIONS = (\n    "overcurrent_switch",\n    "switch",\n    "retries",\n    "motor_closed_loop",\n)''', '''CONTROL_OPTIONS = (\n    "overcurrent_switch",\n    "switch",\n    "retries",\n    "startup_delay",\n    "retry_delay",\n    "motor_closed_loop",\n)''')

          rep('''    closed_loop_axes: tuple[str, ...]\n    startup_retries: int\n    switch: int''', '''    closed_loop_axes: tuple[str, ...]\n    startup_retries: int\n    startup_delay: float\n    retry_delay: float\n    switch: int''')

          rep('''            closed_loop_axes=cls._parse_closed_loop_axes(config),\n            startup_retries=config.getint("retries", 3, minval=0, maxval=10),\n            switch=config.getint("switch", 1, minval=0, maxval=1),''', '''            closed_loop_axes=cls._parse_closed_loop_axes(config),\n            startup_retries=config.getint("retries", 8, minval=0, maxval=20),\n            startup_delay=config.getfloat(\n                "startup_delay", 5.0, minval=0.0, maxval=120.0),\n            retry_delay=config.getfloat(\n                "retry_delay", 3.0, minval=0.0, maxval=60.0),\n            switch=config.getint("switch", 1, minval=0, maxval=1),''')

          rep('STARTUP_AUTO_RETRY_DELAY = 2.0', 'DEFAULT_STARTUP_DELAY = 5.0\nDEFAULT_RETRY_DELAY = 3.0')

          rep('''            "K2 Pro topology closed_loop=%s retries=%d switch=%d overcurrent_switch=%d",\n            ",".join(self.config_model.closed_loop_axes),\n            self.config_model.startup_retries,\n            self.config_model.switch,\n            self.config_model.overcurrent_switch,''', '''            "K2 Pro topology closed_loop=%s retries=%d startup_delay=%.1fs retry_delay=%.1fs switch=%d overcurrent_switch=%d",\n            ",".join(self.config_model.closed_loop_axes),\n            self.config_model.startup_retries,\n            self.config_model.startup_delay,\n            self.config_model.retry_delay,\n            self.config_model.switch,\n            self.config_model.overcurrent_switch,''')

          rep('''        self.auto_retry = True\n        self.startup_retry_limit = self.config_model.startup_retries\n        self.cut_pos_offset = self.config_model.cut_pos_offset''', '''        self.auto_retry = True\n        self.startup_retry_limit = self.config_model.startup_retries\n        self.startup_delay = self.config_model.startup_delay\n        self.retry_delay = self.config_model.retry_delay\n        self.cut_pos_offset = self.config_model.cut_pos_offset''')

          rep('''                            STARTUP_AUTO_RETRY_DELAY,\n                            next_retry,''', '''                            self.retry_delay,\n                            next_retry,''')
          rep('return self.reactor.monotonic() + STARTUP_AUTO_RETRY_DELAY', 'return self.reactor.monotonic() + self.retry_delay')

          rep('''        when = self.reactor.monotonic()\n        _klog("scheduling startup sequence at %.3f", when)\n        self.reactor.update_timer(self._startup_timer, when)''', '''        now = self.reactor.monotonic()\n        when = now + self.startup_delay\n        _klog(\n            "scheduling startup sequence at %.3f (delay %.1fs)",\n            when, self.startup_delay)\n        self.reactor.update_timer(self._startup_timer, when)''')

          if 'STARTUP_AUTO_RETRY_DELAY' in s:
              raise SystemExit('legacy retry delay marker still present')
          p.write_text(s)

          cfg = Path('config/k2/motor_control.cfg')
          c = cfg.read_text()
          old = 'retries: 4\ncut_pos_offset: 0.4'
          new = ('retries: 8\n'
                 'startup_delay: 5.0  # grace period after RS485 becomes ready\n'
                 'retry_delay: 3.0    # delay between automatic startup retries\n'
                 'cut_pos_offset: 0.4')
          if old not in c:
              raise SystemExit('motor_control.cfg retry marker not found')
          cfg.write_text(c.replace(old, new, 1))
          PY

      - name: Add CM5 transport startup gate helpers
        run: |
          mkdir -p scripts
          cat > scripts/k2-openhost-wait-transport.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          timeout="${K2_OPENHOST_TRANSPORT_TIMEOUT:-60}"
          devices="${K2_OPENHOST_TRANSPORT_DEVICES:-/dev/ttyUSB0 /dev/ttyUSB1 /dev/ttyUSB2}"
          started=$SECONDS

          echo "k2-openhost: waiting up to ${timeout}s for transport: ${devices}" >&2
          while (( SECONDS - started < timeout )); do
              missing=()
              for dev in ${devices}; do
                  if [[ ! -c "${dev}" || ! -r "${dev}" || ! -w "${dev}" ]]; then
                      missing+=("${dev}")
                  fi
              done
              if (( ${#missing[@]} == 0 )); then
                  echo "k2-openhost: transport ready after $((SECONDS-started))s" >&2
                  exit 0
              fi
              sleep 0.25
          done

          echo "k2-openhost: transport timeout; unavailable devices:" >&2
          for dev in ${devices}; do
              [[ -c "${dev}" && -r "${dev}" && -w "${dev}" ]] || echo "  ${dev}" >&2
          done
          exit 1
          EOF
          chmod +x scripts/k2-openhost-wait-transport.sh

          cat > scripts/install-k2-openhost-systemd-gate.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          service="${K2_OPENHOST_KLIPPER_SERVICE:-klipper.service}"
          dropin_dir="/etc/systemd/system/${service}.d"
          helper="/usr/local/libexec/k2-openhost/wait-transport.sh"
          dropin="${dropin_dir}/k2-openhost-transport.conf"

          if [[ ${EUID} -ne 0 ]]; then
              echo "Run with sudo: sudo $0 [--remove]" >&2
              exit 2
          fi

          if [[ "${1:-}" == "--remove" ]]; then
              rm -f "${dropin}" "${helper}"
              systemctl daemon-reload
              echo "Removed K2-OpenHost transport gate from ${service}."
              exit 0
          fi

          repo_root="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          install -Dm755 "${repo_root}/scripts/k2-openhost-wait-transport.sh" "${helper}"
          mkdir -p "${dropin_dir}"
          cat > "${dropin}" <<'DROPIN'
          [Service]
          Environment="K2_OPENHOST_TRANSPORT_TIMEOUT=60"
          Environment="K2_OPENHOST_TRANSPORT_DEVICES=/dev/ttyUSB0 /dev/ttyUSB1 /dev/ttyUSB2"
          ExecStartPre=/usr/local/libexec/k2-openhost/wait-transport.sh
          Restart=on-failure
          RestartSec=5
          DROPIN
          systemctl daemon-reload
          echo "Installed ${dropin}. Restart Klipper when ready: systemctl restart ${service}"
          EOF
          chmod +x scripts/install-k2-openhost-systemd-gate.sh

      - name: Validate
        run: |
          python3 -m py_compile klippy/extras/motor_control.py
          bash -n scripts/k2-openhost-wait-transport.sh
          bash -n scripts/install-k2-openhost-systemd-gate.sh
          grep -nE 'retries:|startup_delay:|retry_delay:' config/k2/motor_control.cfg | head
          grep -nE 'startup_delay|retry_delay|STARTUP_PROBE_ADDRS' klippy/extras/motor_control.py | head -30

      - name: Commit hardening and remove one-shot workflow
        run: |
          git config user.name "MzTechnology97"
          git config user.email "86824210+MzTechnology97@users.noreply.github.com"
          git rm .github/workflows/k2-openhost-startup-hardening.yml
          git add klippy/extras/motor_control.py config/k2/motor_control.cfg scripts/
          git commit -m "k2-openhost: harden cold-boot startup timing"
          git push origin HEAD:k2-pro-openhost
